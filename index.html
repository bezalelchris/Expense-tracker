<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>

        <div id="balance-container">
            <h2>Your Balance</h2>
            <p id="balance">$0.00</p>
        </div>

        <div id="summary">
            <div>
                <h3>Income</h3>
                <p id="income" class="money plus">+$0.00</p>
            </div>
            <div>
                <h3>Expenses</h3>
                <p id="expense" class="money minus">-$0.00</p>
            </div>
        </div>

        <h3>Add New Transaction</h3>
        <form id="transaction-form">
            <input type="text" id="text" placeholder="Enter description" required>
            <input type="number" id="amount" placeholder="Enter amount (e.g. -20 or 100)" required>
            <button type="submit">Add Transaction</button>
        </form>

        <h3>History</h3>
        <ul id="transaction-list" class="list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
